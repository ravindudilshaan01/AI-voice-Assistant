services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:?Add GROQ_API_KEY to .env}
      - GROQ_LLM_MODEL=${GROQ_LLM_MODEL:-llama-3.1-8b-instant}
      - GROQ_TOOL_MODEL=${GROQ_TOOL_MODEL:-openai/gpt-oss-20b}
      - GROQ_STT_MODEL=${GROQ_STT_MODEL:-whisper-large-v3-turbo}
      - GROQ_STT_LANGUAGE=${GROQ_STT_LANGUAGE:-en}
      - GROQ_STT_PROMPT=${GROQ_STT_PROMPT:-Sri Lankan English conversation. Place names may include Gampaha, Colombo, Kandy, Galle, Jaffna, and Sri Lanka.}
      - GROQ_TTS_MODEL=${GROQ_TTS_MODEL:-canopylabs/orpheus-v1-english}
      - GROQ_TTS_VOICE=${GROQ_TTS_VOICE:-troy}
      - TTS_PROVIDER=${TTS_PROVIDER:-kokoro}
      - TTS_AUTO_FALLBACK=${TTS_AUTO_FALLBACK:-1}
      - TTS_QUEUE_SIZE=${TTS_QUEUE_SIZE:-8}
      - TOOL_TIMEOUT_SECONDS=${TOOL_TIMEOUT_SECONDS:-12}
      - KOKORO_MODEL_PATH=${KOKORO_MODEL_PATH:-/app/models/kokoro/kokoro-v1.0.int8.onnx}
      - KOKORO_VOICES_PATH=${KOKORO_VOICES_PATH:-/app/models/kokoro/voices-v1.0.bin}
      - KOKORO_MALE_VOICE=${KOKORO_MALE_VOICE:-am_michael}
      - KOKORO_FEMALE_VOICE=${KOKORO_FEMALE_VOICE:-af_bella}
      - ONNX_PROVIDER=${ONNX_PROVIDER:-}
      - WEATHER_PREFERRED_COUNTRY=${WEATHER_PREFERRED_COUNTRY:-Sri Lanka}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:5173}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - ./backend/models:/app/models:ro

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000/ws}
    depends_on:
      backend:
        condition: service_healthy
